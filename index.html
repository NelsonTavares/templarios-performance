<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Templários • Performance</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --red: #b5161b;
      --red-light: #e2383e;
      --red-dark: #650d10;

      --black: #050505;
      --panel: #101010;
      --panel-2: #171717;

      --border: #303030;

      --white: #f5f5f5;
      --silver: #c9c9c9;
      --muted: #858585;

      --gold: #b99a55;
    }

    body {
      min-height: 100vh;

      color: var(--white);

      font-family: Inter, sans-serif;

      background:
        radial-gradient(
          circle at 50% -15%,
          rgba(181, 22, 27, .32),
          transparent 38%
        ),
        radial-gradient(
          circle at 0% 100%,
          rgba(100, 10, 10, .16),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #050505,
          #111111 50%,
          #050505
        );
    }

    body::before {
      content: "";

      position: fixed;
      inset: 0;

      pointer-events: none;

      opacity: .045;

      background-image:
        linear-gradient(
          rgba(255,255,255,.15) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,.15) 1px,
          transparent 1px
        );

      background-size: 50px 50px;
    }

    .container {
      width: min(1450px, 94%);
      margin: auto;

      padding: 35px 0 60px;

      position: relative;
    }

    /* ========================================
       HEADER
    ======================================== */

    header {
      text-align: center;

      margin-bottom: 42px;
    }

    .logo-wrapper {
      width: 150px;
      height: 150px;

      margin: 0 auto 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid rgba(210,210,210,.25);

      border-radius: 20px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.06),
          rgba(255,255,255,.015)
        );

      box-shadow:
        0 20px 60px rgba(0,0,0,.55),
        0 0 45px rgba(181,22,27,.12);

      overflow: hidden;
    }

    .logo-wrapper img {
      width: 94%;
      height: 94%;

      object-fit: contain;
    }

    .eyebrow {
      color: var(--red-light);

      font-size: 11px;
      font-weight: 800;

      letter-spacing: 4px;

      text-transform: uppercase;

      margin-bottom: 10px;
    }

    h1 {
      font-family: Cinzel, serif;

      font-size: clamp(35px, 5vw, 64px);

      line-height: 1;

      letter-spacing: 4px;

      text-transform: uppercase;
    }

    .subtitle {
      margin-top: 13px;

      color: var(--muted);

      font-size: 12px;
      font-weight: 600;

      letter-spacing: 3px;

      text-transform: uppercase;
    }

    .period {
      display: inline-flex;
      align-items: center;
      gap: 9px;

      margin-top: 20px;

      padding: 9px 18px;

      border: 1px solid #3b3b3b;

      border-radius: 999px;

      background: rgba(255,255,255,.025);

      color: var(--silver);

      font-size: 12px;
      font-weight: 700;

      letter-spacing: 1px;
    }

    .period::before {
      content: "";

      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--red-light);

      box-shadow:
        0 0 10px var(--red);
    }

    /* ========================================
       SECTION
    ======================================== */

    .section-title {
      display: flex;
      align-items: center;
      gap: 14px;

      margin: 40px 0 18px;

      font-family: Cinzel, serif;

      font-size: 20px;
      font-weight: 700;

      letter-spacing: 1px;

      text-transform: uppercase;
    }

    .section-title::before {
      content: "";

      width: 5px;
      height: 27px;

      border-radius: 2px;

      background:
        linear-gradient(
          to bottom,
          var(--red-light),
          var(--red-dark)
        );
    }

    /* ========================================
       TEAM METRICS
    ======================================== */

    .team-grid {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 16px;
    }

    .metric {
      position: relative;

      overflow: hidden;

      padding: 23px;

      border: 1px solid var(--border);

      border-radius: 14px;

      background:
        linear-gradient(
          145deg,
          #191919,
          #0d0d0d
        );

      box-shadow:
        0 15px 45px rgba(0,0,0,.25);
    }

    .metric.liquid {
      border-color:
        rgba(181,22,27,.65);

      background:
        linear-gradient(
          145deg,
          rgba(120,10,14,.32),
          #111111
        );
    }

    .metric-label {
      color: #909090;

      font-size: 10px;
      font-weight: 800;

      letter-spacing: 1.8px;

      text-transform: uppercase;
    }

    .metric-value {
      margin-top: 8px;

      font-family: Cinzel, serif;

      font-size: 34px;
      font-weight: 700;
    }

    .metric.liquid .metric-value {
      color: var(--red-light);
    }

    /* ========================================
       SELLERS
    ======================================== */

    .sellers {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 18px;
    }

    .seller-card {
      position: relative;

      overflow: hidden;

      padding: 18px;

      border: 1px solid #303030;

      border-radius: 16px;

      background:
        linear-gradient(
          145deg,
          #191919,
          #0c0c0c
        );

      box-shadow:
        0 18px 45px rgba(0,0,0,.30);

      transition:
        transform .2s ease,
        border-color .2s ease;
    }

    .seller-card:hover {
      transform: translateY(-4px);

      border-color:
        rgba(181,22,27,.7);
    }

    .seller-card::before {
      content: "";

      position: absolute;

      top: 0;
      left: 0;
      right: 0;

      height: 3px;

      background:
        linear-gradient(
          90deg,
          var(--red-dark),
          var(--red-light),
          var(--red-dark)
        );
    }

    /* ========================================
       PHOTO
    ======================================== */

    .photo-frame {
      position: relative;

      width: 100%;

      aspect-ratio: 1 / 1;

      margin-bottom: 17px;

      padding: 6px;

      border: 1px solid #4b4b4b;

      border-radius: 14px;

      background:
        linear-gradient(
          145deg,
          #262626,
          #0a0a0a
        );

      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.025),
        0 10px 25px rgba(0,0,0,.45);

      overflow: hidden;
    }

    .photo-frame::before {
      content: "";

      position: absolute;

      inset: 4px;

      border: 1px solid rgba(181,22,27,.45);

      border-radius: 10px;

      pointer-events: none;

      z-index: 2;
    }

    .seller-photo {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;

      border-radius: 9px;

      background: #090909;
    }

    .rank-badge {
      position: absolute;

      left: 50%;
      bottom: 13px;

      transform: translateX(-50%);

      z-index: 3;

      white-space: nowrap;

      padding: 7px 14px;

      border: 1px solid rgba(255,255,255,.25);

      border-radius: 999px;

      background:
        rgba(5,5,5,.88);

      backdrop-filter: blur(8px);

      color: #f5f5f5;

      font-family: Cinzel, serif;

      font-size: 10px;
      font-weight: 800;

      letter-spacing: 1.3px;

      text-transform: uppercase;
    }

    /* ========================================
       SELLER INFO
    ======================================== */

    .seller-name {
      font-family: Cinzel, serif;

      font-size: 18px;
      font-weight: 700;

      margin-bottom: 5px;
    }

    .seller-objective {
      color: #777;

      font-size: 11px;
      font-weight: 600;

      margin-bottom: 18px;
    }

    /* ========================================
       PROGRESS
    ======================================== */

    .progress-info {
      display: flex;

      justify-content: space-between;
      align-items: center;

      margin-bottom: 8px;

      font-size: 11px;
      font-weight: 700;

      letter-spacing: 1px;

      text-transform: uppercase;
    }

    .percentage {
      color: var(--red-light);

      font-size: 14px;
      font-weight: 800;
    }

    .progress {
      width: 100%;
      height: 9px;

      background: #292929;

      border-radius: 999px;

      overflow: hidden;

      margin-bottom: 18px;
    }

    .progress-bar {
      height: 100%;

      border-radius: 999px;

      background:
        linear-gradient(
          90deg,
          #641014,
          #a71920,
          #e2383e
        );

      transition:
        width .7s ease;
    }

    /* ========================================
       STATS
    ======================================== */

    .seller-stats {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 8px;
    }

    .stat {
      padding: 10px;

      border: 1px solid rgba(255,255,255,.045);

      border-radius: 8px;

      background:
        rgba(255,255,255,.025);
    }

    .stat-label {
      color: #707070;

      font-size: 8px;
      font-weight: 800;

      letter-spacing: 1px;

      text-transform: uppercase;
    }

    .stat-value {
      margin-top: 5px;

      font-size: 18px;
      font-weight: 800;
    }

    .liquid-stat {
      border-color:
        rgba(181,22,27,.4);

      background:
        rgba(181,22,27,.055);
    }

    .liquid-stat .stat-value {
      color: var(--red-light);
    }

    /* ========================================
       FOOTER
    ======================================== */

    footer {
      margin-top: 55px;

      padding-top: 20px;

      border-top:
        1px solid rgba(255,255,255,.06);

      text-align: center;

      color: #555;

      font-size: 10px;
      font-weight: 700;

      letter-spacing: 3px;

      text-transform: uppercase;
    }

    .loading,
    .error {
      grid-column: 1 / -1;

      padding: 50px;

      border: 1px solid #292929;

      border-radius: 14px;

      background: #101010;

      text-align: center;
    }

    .loading {
      color: #888;
    }

    .error {
      color: #e05252;
    }

    /* ========================================
       RESPONSIVE
    ======================================== */

    @media (max-width: 1100px) {

      .team-grid,
      .sellers {
        grid-template-columns:
          repeat(2, 1fr);
      }

    }

    @media (max-width: 650px) {

      .container {
        width: 92%;
        padding-top: 25px;
      }

      .logo-wrapper {
        width: 125px;
        height: 125px;
      }

      h1 {
        font-size: 34px;
        letter-spacing: 2px;
      }

      .eyebrow {
        font-size: 9px;
        letter-spacing: 2px;
      }

      .team-grid,
      .sellers {
        grid-template-columns: 1fr;
      }

      .metric-value {
        font-size: 30px;
      }

    }

  </style>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>

  <main class="container">


    <!-- =====================================
         CABEÇALHO
    ====================================== -->

    <header>

      <div class="logo-wrapper">

        <img
          src="TEMPLARIOS.png"
          alt="Templários"
        >

      </div>


      <div class="eyebrow">
        ORDEM • DISCIPLINA • PERFORMANCE
      </div>


      <h1>
        Templários
      </h1>


      <div class="subtitle">
        Performance dos Cavaleiros
      </div>


      <div
        class="period"
        id="periodo"
      >
        A carregar...
      </div>

    </header>


    <!-- =====================================
         EQUIPA
    ====================================== -->

    <div class="section-title">
      Performance da Ordem
    </div>


    <section class="team-grid">


      <div class="metric">

        <div class="metric-label">
          TV Bruta
        </div>

        <div
          class="metric-value"
          id="teamBruta"
        >
          0
        </div>

      </div>


      <div class="metric">

        <div class="metric-label">
          TV Anulada
        </div>

        <div
          class="metric-value"
          id="teamAnulada"
        >
          0
        </div>

      </div>


      <div class="metric liquid">

        <div class="metric-label">
          TV Líquida
        </div>

        <div
          class="metric-value"
          id="teamLiquida"
        >
          0
        </div>

      </div>


      <div class="metric">

        <div class="metric-label">
          TV Instalada
        </div>

        <div
          class="metric-value"
          id="teamInstalada"
        >
          0
        </div>

      </div>


    </section>


    <!-- =====================================
         CAVALEIROS
    ====================================== -->

    <div class="section-title">
      Performance dos Cavaleiros
    </div>


    <section
      class="sellers"
      id="sellers"
    >

      <div class="loading">
        A carregar a Ordem...
      </div>

    </section>


    <footer>
      Templários • A Ordem em Marcha
    </footer>


  </main>


  <script>


    /* =====================================
       CONFIGURAÇÃO DAS FOTOGRAFIAS
    ====================================== */

    const fotos = {

      "Sir. David": {

        recruta:
          "RECRUTA_SIR_DAVID.png",

        escudeiro:
          "ESCUDEIRO_SIR_DAVID.png",

        cavaleiro:
          "CAVALEIRO_SIR_DAVID.png",

        comendador:
          "COMENDADOR_SIR_DAVID.png",

        grao_mestre:
          "GRÃO_MESTRE_SIR_DAVID.png"

      },


      "Fearless Kate": {

        recruta:
          "RECRUTA_FEARLESS_KATE.png",

        escudeiro:
          "ESCUDEIRO_FEARLESS_KATE.png",

        cavaleiro:
          "CAVALEIRO_FEARLESS_KATE.png",

        comendador:
          "COMENDADOR_FEARLESS_KATE.png",

        grao_mestre:
          "GRÃO_MESTRE_FEARLESS_KATE.png"

      },


      "Lord Lili": {

        recruta:
          "RECRUTA_LILI.png",

        escudeiro:
          "ESCUDEIRO_LILI.png",

        cavaleiro:
          "CAVALEIRO_LILI.png",

        comendador:
          "COMENDADOR_LILI.png",

        grao_mestre:
          "GRÃO_MESTRE_LILI.png"

      },


      "Knight Salvador": {

        recruta:
          "RECRUTA_KNIGHT_SALVADOR.png",

        escudeiro:
          "ESCUDEIRO_KNIGHT_SALVADOR.png",

        cavaleiro:
          "CAVALEIRO_KNIGHT_SALVADOR.png",

        comendador:
          "COMENDADOR_KNIGHT_SALVADOR.png",

        grao_mestre:
          "GRÃO_MESTRE_KNIGHT_SALVADOR.png"

      }

    };


    /* =====================================
       PATENTES
    ====================================== */

    function obterPatente(percentagem) {


      if (percentagem >= 120) {

        return {
          nome: "Grão-Mestre",
          chave: "grao_mestre"
        };

      }


      if (percentagem >= 100) {

        return {
          nome: "Comendador",
          chave: "comendador"
        };

      }


      if (percentagem >= 75) {

        return {
          nome: "Cavaleiro",
          chave: "cavaleiro"
        };

      }


      if (percentagem >= 50) {

        return {
          nome: "Escudeiro",
          chave: "escudeiro"
        };

      }


      return {
        nome: "Recruta",
        chave: "recruta"
      };

    }


    /* =====================================
       CARREGAR DADOS
    ====================================== */


    /* SUPABASE — substituir apenas estes dois valores */
    const SUPABASE_URL = "https://sldhftvtoeolkhmezoyx.supabase.co";
    const SUPABASE_KEY = "sb_publishable_ktyOdBXYTRKEpeVMnEraig_JJIBWNH0";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function carregarDados() {
      try {
        const { data: periodo, error: erroPeriodo } = await supabaseClient
          .from("periods")
          .select("id,nome")
          .eq("ativo", true)
          .order("data_inicio", { ascending: false })
          .limit(1)
          .maybeSingle();

        if (erroPeriodo) throw erroPeriodo;
        if (!periodo) throw new Error("Não existe nenhum período ativo.");

        document.getElementById("periodo").textContent = periodo.nome;

        const { data: vendedores, error: erroPerformance } = await supabaseClient
          .from("performance_dashboard")
          .select("id,seller_id,vendedor,period_id,periodo,objetivo,tv_bruta,tv_anulada,tv_liquida,tv_instalada,percentagem")
          .eq("period_id", periodo.id)
          .order("percentagem", { ascending: false });

        if (erroPerformance) throw erroPerformance;

        const lista = Array.isArray(vendedores) ? vendedores : [];
        let bruta = 0, anulada = 0, instalada = 0;

        lista.forEach(v => {
          bruta += Number(v.tv_bruta) || 0;
          anulada += Number(v.tv_anulada) || 0;
          instalada += Number(v.tv_instalada) || 0;
        });

        document.getElementById("teamBruta").textContent = bruta;
        document.getElementById("teamAnulada").textContent = anulada;
        document.getElementById("teamLiquida").textContent = bruta - anulada;
        document.getElementById("teamInstalada").textContent = instalada;

        const area = document.getElementById("sellers");
        area.innerHTML = "";

        if (!lista.length) {
          area.innerHTML = '<div class="error">Não existem dados de performance para este período.</div>';
          return;
        }

        lista.forEach(vendedor => {
          const objetivo = Number(vendedor.objetivo) || 0;
          const tvBruta = Number(vendedor.tv_bruta) || 0;
          const tvAnulada = Number(vendedor.tv_anulada) || 0;
          const tvLiquida = Number(vendedor.tv_liquida) || 0;
          const tvInstalada = Number(vendedor.tv_instalada) || 0;
          const percentagem = Number(vendedor.percentagem) || 0;
          const patente = obterPatente(percentagem);
          const fotosPessoa = fotos[vendedor.vendedor];
          let fotografia = "TEMPLARIOS.png";

          if (fotosPessoa && fotosPessoa[patente.chave]) fotografia = fotosPessoa[patente.chave];

          const barra = Math.min(Math.max(percentagem, 0), 100);
          const card = document.createElement("article");
          card.className = "seller-card";
          card.innerHTML = `
            <div class="photo-frame">
              <img class="seller-photo" src="${fotografia}" alt="Fotografia de ${vendedor.vendedor}" onerror="this.onerror=null;this.src='TEMPLARIOS.png';">
              <div class="rank-badge">${patente.nome}</div>
            </div>
            <div class="seller-name">${vendedor.vendedor}</div>
            <div class="seller-objective">Objetivo individual: ${objetivo}</div>
            <div class="progress-info"><span>Atingimento</span><span class="percentage">${percentagem.toFixed(1)}%</span></div>
            <div class="progress"><div class="progress-bar" style="width:${barra}%"></div></div>
            <div class="seller-stats">
              <div class="stat"><div class="stat-label">TV Bruta</div><div class="stat-value">${tvBruta}</div></div>
              <div class="stat"><div class="stat-label">TV Anulada</div><div class="stat-value">${tvAnulada}</div></div>
              <div class="stat liquid-stat"><div class="stat-label">TV Líquida</div><div class="stat-value">${tvLiquida}</div></div>
              <div class="stat"><div class="stat-label">TV Instalada</div><div class="stat-value">${tvInstalada}</div></div>
            </div>`;
          area.appendChild(card);
        });

      } catch (erro) {
        console.error("Erro Supabase:", erro);
        document.getElementById("sellers").innerHTML = `
          <div class="error"><strong>Erro ao carregar os dados.</strong><br><br>Verifica o Project URL, a Publishable key e as políticas do Supabase.</div>`;
      }
    }

    /* =====================================
       INICIAR
    ====================================== */

    carregarDados();


  </script>

</body>
</html>
