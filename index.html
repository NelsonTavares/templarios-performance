<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Templários • Performance</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --red: #b5161b;
      --red-light: #e2383e;
      --red-dark: #650d10;
      --black: #070707;
      --panel: #111111;
      --panel-light: #181818;
      --border: #303030;
      --silver: #d4d4d4;
      --muted: #8c8c8c;
      --gold: #b99a55;
    }

    body {
      min-height: 100vh;
      color: #f4f4f4;
      font-family: Inter, sans-serif;

      background:
        radial-gradient(
          circle at 50% -15%,
          rgba(181, 22, 27, 0.30),
          transparent 38%
        ),
        radial-gradient(
          circle at 0% 100%,
          rgba(100, 10, 10, 0.15),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #050505 0%,
          #111111 50%,
          #050505 100%
        );
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.055;

      background-image:
        linear-gradient(rgba(255,255,255,.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.15) 1px, transparent 1px);

      background-size: 50px 50px;
    }

    .container {
      width: min(1450px, 94%);
      margin: auto;
      padding: 35px 0 60px;
      position: relative;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      text-align: center;
      margin-bottom: 42px;
    }

    .logo-wrapper {
      width: 150px;
      height: 150px;
      margin: 0 auto 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid rgba(190, 190, 190, 0.25);
      border-radius: 18px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.06),
          rgba(255,255,255,.015)
        );

      box-shadow:
        0 0 0 1px rgba(181,22,27,.12),
        0 20px 60px rgba(0,0,0,.5),
        0 0 50px rgba(181,22,27,.10);

      overflow: hidden;
    }

    .logo-wrapper img {
      width: 92%;
      height: 92%;
      object-fit: contain;
      display: block;
    }

    .eyebrow {
      color: var(--red-light);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    h1 {
      font-family: Cinzel, serif;
      font-size: clamp(34px, 5vw, 64px);
      line-height: 1;
      letter-spacing: 4px;
      text-transform: uppercase;

      text-shadow:
        0 3px 20px rgba(0,0,0,.8);
    }

    .subtitle {
      margin-top: 13px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .period {
      display: inline-flex;
      align-items: center;
      gap: 9px;

      margin-top: 20px;
      padding: 9px 18px;

      border: 1px solid #3b3b3b;
      border-radius: 999px;

      background: rgba(255,255,255,.025);

      color: var(--silver);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .period::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--red-light);
      box-shadow: 0 0 10px var(--red);
    }

    /* =========================
       SECTION
    ========================= */

    .section-title {
      display: flex;
      align-items: center;
      gap: 14px;

      margin: 40px 0 18px;

      font-family: Cinzel, serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .section-title::before {
      content: "";
      width: 5px;
      height: 27px;
      border-radius: 2px;
      background: linear-gradient(
        to bottom,
        var(--red-light),
        var(--red-dark)
      );

      box-shadow: 0 0 15px rgba(181,22,27,.4);
    }

    /* =========================
       TEAM METRICS
    ========================= */

    .team-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .metric {
      position: relative;
      overflow: hidden;

      padding: 23px;

      border: 1px solid var(--border);
      border-radius: 14px;

      background:
        linear-gradient(
          145deg,
          #191919,
          #0d0d0d
        );

      box-shadow:
        0 15px 45px rgba(0,0,0,.25);

      transition: .2s ease;
    }

    .metric:hover {
      transform: translateY(-2px);
      border-color: #494949;
    }

    .metric::after {
      content: "";
      position: absolute;
      width: 90px;
      height: 90px;
      right: -35px;
      bottom: -40px;

      border-radius: 50%;
      background: rgba(255,255,255,.025);
    }

    .metric.liquid {
      border-color: rgba(181,22,27,.65);

      background:
        linear-gradient(
          145deg,
          rgba(120, 10, 14, .32),
          #111111
        );

      box-shadow:
        0 15px 45px rgba(0,0,0,.25),
        inset 0 0 35px rgba(181,22,27,.05);
    }

    .metric-label {
      color: #909090;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.8px;
      text-transform: uppercase;
    }

    .metric-value {
      margin-top: 8px;

      font-family: Cinzel, serif;
      font-size: 34px;
      font-weight: 700;
    }

    .metric.liquid .metric-value {
      color: var(--red-light);
    }

    /* =========================
       SELLERS
    ========================= */

    .sellers {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .seller-card {
      position: relative;
      overflow: hidden;

      padding: 22px;

      border: 1px solid #303030;
      border-radius: 15px;

      background:
        linear-gradient(
          145deg,
          #191919,
          #0c0c0c
        );

      box-shadow:
        0 18px 45px rgba(0,0,0,.28);

      transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;
    }

    .seller-card:hover {
      transform: translateY(-4px);

      border-color: rgba(181,22,27,.65);

      box-shadow:
        0 25px 55px rgba(0,0,0,.4),
        0 0 30px rgba(181,22,27,.06);
    }

    .seller-card::before {
      content: "";
      position: absolute;

      left: 0;
      right: 0;
      top: 0;

      height: 3px;

      background:
        linear-gradient(
          90deg,
          var(--red-dark),
          var(--red-light),
          var(--red-dark)
        );
    }

    .seller-name {
      font-family: Cinzel, serif;
      font-size: 19px;
      font-weight: 700;

      margin-bottom: 5px;
    }

    .seller-objective {
      color: #777;
      font-size: 11px;
      font-weight: 600;

      margin-bottom: 20px;
    }

    /* =========================
       PROGRESS
    ========================= */

    .progress-info {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 8px;

      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .percentage {
      color: var(--red-light);
      font-size: 13px;
      font-weight: 800;
    }

    .progress {
      width: 100%;
      height: 9px;

      background: #292929;

      border-radius: 999px;
      overflow: hidden;

      margin-bottom: 19px;

      box-shadow:
        inset 0 1px 3px rgba(0,0,0,.8);
    }

    .progress-bar {
      height: 100%;

      background:
        linear-gradient(
          90deg,
          #641014,
          #a71920,
          #e2383e
        );

      border-radius: 999px;

      box-shadow:
        0 0 12px rgba(226,56,62,.25);

      transition: width .7s ease;
    }

    /* =========================
       SELLER STATS
    ========================= */

    .seller-stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
    }

    .stat {
      padding: 11px;

      border: 1px solid rgba(255,255,255,.04);
      border-radius: 8px;

      background: rgba(255,255,255,.025);
    }

    .stat-label {
      color: #707070;

      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .stat-value {
      margin-top: 5px;

      font-size: 19px;
      font-weight: 800;
    }

    .liquid-stat {
      border-color: rgba(181,22,27,.35);
      background: rgba(181,22,27,.055);
    }

    .liquid-stat .stat-value {
      color: var(--red-light);
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      margin-top: 55px;

      padding-top: 20px;

      border-top: 1px solid rgba(255,255,255,.06);

      text-align: center;

      color: #555;

      font-size: 10px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* =========================
       LOADING / ERROR
    ========================= */

    .loading,
    .error {
      grid-column: 1 / -1;

      padding: 50px;

      border: 1px solid #292929;
      border-radius: 14px;

      background: #101010;

      text-align: center;
    }

    .loading {
      color: #888;
    }

    .error {
      color: #e05252;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 1100px) {

      .team-grid,
      .sellers {
        grid-template-columns: repeat(2, 1fr);
      }

    }

    @media (max-width: 650px) {

      .container {
        width: 92%;
        padding-top: 25px;
      }

      .logo-wrapper {
        width: 125px;
        height: 125px;
      }

      h1 {
        font-size: 34px;
        letter-spacing: 2px;
      }

      .eyebrow {
        font-size: 9px;
        letter-spacing: 2px;
      }

      .team-grid,
      .sellers {
        grid-template-columns: 1fr;
      }

      .metric-value {
        font-size: 30px;
      }

    }
  </style>
</head>

<body>

  <main class="container">

    <!-- =========================
         CABEÇALHO
    ========================== -->

    <header>

      <div class="logo-wrapper">
        <img
          src="TEMPLARIOS.png"
          alt="Logótipo dos Templários"
        >
      </div>

      <div class="eyebrow">
        ORDEM • DISCIPLINA • PERFORMANCE
      </div>

      <h1>
        Templários
      </h1>

      <div class="subtitle">
        Performance dos Cavaleiros
      </div>

      <div
        class="period"
        id="periodo"
      >
        A carregar...
      </div>

    </header>


    <!-- =========================
         PERFORMANCE DA EQUIPA
    ========================== -->

    <div class="section-title">
      Performance da Ordem
    </div>

    <section class="team-grid">

      <div class="metric">

        <div class="metric-label">
          TV Bruta
        </div>

        <div
          class="metric-value"
          id="teamBruta"
        >
          0
        </div>

      </div>


      <div class="metric">

        <div class="metric-label">
          TV Anulada
        </div>

        <div
          class="metric-value"
          id="teamAnulada"
        >
          0
        </div>

      </div>


      <div class="metric liquid">

        <div class="metric-label">
          TV Líquida
        </div>

        <div
          class="metric-value"
          id="teamLiquida"
        >
          0
        </div>

      </div>


      <div class="metric">

        <div class="metric-label">
          TV Instalada
        </div>

        <div
          class="metric-value"
          id="teamInstalada"
        >
          0
        </div>

      </div>

    </section>


    <!-- =========================
         CAVALEIROS
    ========================== -->

    <div class="section-title">
      Performance dos Cavaleiros
    </div>

    <section
      class="sellers"
      id="sellers"
    >

      <div class="loading">
        A carregar os dados da Ordem...
      </div>

    </section>


    <footer>
      Templários • A Ordem em Marcha
    </footer>

  </main>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script>

    async function carregarDados() {

      try {

        const resposta = await fetch(
          "dados.json?versao=" + Date.now()
        );

        if (!resposta.ok) {

          throw new Error(
            "Não foi possível carregar o dados.json"
          );

        }

        const dados = await resposta.json();


        /* =========================
           PERÍODO
        ========================== */

        document.getElementById("periodo").textContent =
          dados.mes || "Período atual";


        /* =========================
           VENDEDORES
        ========================== */

        const vendedores =
          Array.isArray(dados.vendedores)
            ? dados.vendedores
            : [];


        /* =========================
           TOTAIS
        ========================== */

        let bruta = 0;
        let anulada = 0;
        let instalada = 0;


        vendedores.forEach(vendedor => {

          bruta +=
            Number(vendedor.tv_bruta) || 0;

          anulada +=
            Number(vendedor.tv_anulada) || 0;

          instalada +=
            Number(vendedor.tv_instalada) || 0;

        });


        const liquida =
          bruta - anulada;


        /* =========================
           MOSTRAR TOTAIS
        ========================== */

        document.getElementById(
          "teamBruta"
        ).textContent = bruta;


        document.getElementById(
          "teamAnulada"
        ).textContent = anulada;


        document.getElementById(
          "teamLiquida"
        ).textContent = liquida;


        document.getElementById(
          "teamInstalada"
        ).textContent = instalada;


        /* =========================
           CARTÕES
        ========================== */

        const areaVendedores =
          document.getElementById("sellers");


        areaVendedores.innerHTML = "";


        if (vendedores.length === 0) {

          areaVendedores.innerHTML = `
            <div class="error">
              Não existem vendedores no dados.json.
            </div>
          `;

          return;
        }


        vendedores.forEach(vendedor => {

          const objetivo =
            Number(vendedor.objetivo) || 0;

          const tvBruta =
            Number(vendedor.tv_bruta) || 0;

          const tvAnulada =
            Number(vendedor.tv_anulada) || 0;

          const tvInstalada =
            Number(vendedor.tv_instalada) || 0;


          /* TV LÍQUIDA */

          const tvLiquida =
            tvBruta - tvAnulada;


          /* % OBJETIVO */

          const percentagem =
            objetivo > 0
              ? (tvLiquida / objetivo) * 100
              : 0;


          /*
            A barra nunca ultrapassa 100%.
            A percentagem escrita pode ultrapassar
            100%, caso o vendedor ultrapasse o objetivo.
          */

          const percentagemVisual =
            Math.min(
              Math.max(percentagem, 0),
              100
            );


          /* =========================
             CARTÃO
          ========================== */

          const card =
            document.createElement("article");


          card.className =
            "seller-card";


          card.innerHTML = `

            <div class="seller-name">
              ${vendedor.nome}
            </div>

            <div class="seller-objective">
              Objetivo individual:
              ${objetivo}
            </div>


            <div class="progress-info">

              <span>
                TV Líquida
              </span>

              <span class="percentage">
                ${percentagem.toFixed(1)}%
              </span>

            </div>


            <div class="progress">

              <div
                class="progress-bar"
                style="width: ${percentagemVisual}%"
              ></div>

            </div>


            <div class="seller-stats">


              <div class="stat">

                <div class="stat-label">
                  TV Bruta
                </div>

                <div class="stat-value">
                  ${tvBruta}
                </div>

              </div>


              <div class="stat">

                <div class="stat-label">
                  TV Anulada
                </div>

                <div class="stat-value">
                  ${tvAnulada}
                </div>

              </div>


              <div class="stat liquid-stat">

                <div class="stat-label">
                  TV Líquida
                </div>

                <div class="stat-value">
                  ${tvLiquida}
                </div>

              </div>


              <div class="stat">

                <div class="stat-label">
                  TV Instalada
                </div>

                <div class="stat-value">
                  ${tvInstalada}
                </div>

              </div>


            </div>

          `;


          areaVendedores.appendChild(card);

        });


      } catch (erro) {

        console.error(erro);


        document.getElementById(
          "sellers"
        ).innerHTML = `

          <div class="error">

            <strong>
              Erro ao carregar os dados.
            </strong>

            <br><br>

            Confirma se estes dois ficheiros
            estão no mesmo repositório:

            <br><br>

            <strong>
              index.html
            </strong>

            <br>

            <strong>
              dados.json
            </strong>

          </div>

        `;

      }

    }


    /* =========================
       INICIAR
    ========================== */

    carregarDados();

  </script>

</body>
</html>
